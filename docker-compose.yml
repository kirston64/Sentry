services:
  app:
    build: .
    container_name: sentry-dashboard
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - db_data:/app/data
    environment:
      DATABASE_URL: file:/app/data/prod.db
    depends_on: []
    networks:
      - sentry-net

  nginx:
    image: nginx:alpine
    container_name: sentry-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - sentry-net

volumes:
  db_data:
  nginx_logs:

networks:
  sentry-net:
    driver: bridge
